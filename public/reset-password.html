<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CollabNotes | Reset Password</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0b0f18;
            color: #f5f7ff;
            font-family: Arial, sans-serif;
        }

        .reset-card {
            width: 100%;
            max-width: 430px;
            padding: 40px;
            background: #111723;
            border: 1px solid #252d3d;
            border-radius: 18px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
        }

        .brand {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand-icon {
            width: 48px;
            height: 48px;
            margin: 0 auto 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 14px;
            background: #6d5dfc;
            font-size: 24px;
        }

        .brand h1 {
            font-size: 24px;
        }

        .header {
            margin-bottom: 25px;
        }

        .header h2 {
            font-size: 26px;
            margin-bottom: 8px;
        }

        .header p {
            color: #9aa5bb;
            line-height: 1.5;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #30394b;
            border-radius: 10px;
            background: #0d131e;
            color: white;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #6d5dfc;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #6d5dfc;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s ease;
        }

        button:hover {
            background: #7b6cff;
            transform: translateY(-1px);
        }

        .message {
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
        }

        .message.success {
            display: block;
            color: #72e6a8;
            background: rgba(70, 200, 130, 0.1);
        }

        .message.error {
            display: block;
            color: #ff8585;
            background: rgba(255, 80, 80, 0.1);
        }

        .back-login {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #8d7fff;
            text-decoration: none;
            font-size: 14px;
        }

        .back-login:hover {
            text-decoration: underline;
        }

        @media (max-width: 500px) {
            .reset-card {
                margin: 20px;
                padding: 28px 22px;
            }
        }

        /* ---- animations only ---- */
        .reset-card { animation: fxCard 0.9s cubic-bezier(0.22, 1, 0.36, 1) both; }
        .brand-icon { animation: fxIcon 0.8s 0.2s cubic-bezier(0.34, 1.56, 0.64, 1) both, fxPulse 3.5s 1.2s ease-in-out infinite; }
        .header, .input-group, form button { animation: fxUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) both; }
        .header { animation-delay: 0.3s; }
        .input-group:nth-child(1) { animation-delay: 0.42s; }
        .input-group:nth-child(2) { animation-delay: 0.52s; }
        form button { animation-delay: 0.62s; position: relative; overflow: hidden; }
        form button::after { content: ""; position: absolute; top: 0; left: -80%; width: 50%; height: 100%; background: linear-gradient(100deg, transparent, rgba(255,255,255,0.25), transparent); transform: skewX(-20deg); }
        form button:hover::after { left: 130%; transition: left 0.75s cubic-bezier(0.22, 1, 0.36, 1); }
        form button:hover { box-shadow: 0 10px 26px rgba(109, 93, 252, 0.38); }
        .message.success, .message.error { animation: fxUp 0.4s ease both; }
        .message.error { animation: fxUp 0.4s ease both, fxShake 0.45s 0.1s ease; }
        .back-login { animation: fxUp 0.7s 0.75s ease both; transition: transform 0.25s ease; }
        .back-login:hover { transform: translateX(-4px); }
        @keyframes fxCard { from { opacity: 0; transform: translateY(40px) scale(0.96); } to { opacity: 1; transform: none; } }
        @keyframes fxIcon { from { opacity: 0; transform: scale(0.3) rotate(-25deg); } to { opacity: 1; transform: none; } }
        @keyframes fxUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
        @keyframes fxPulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(109, 93, 252, 0.45); } 50% { box-shadow: 0 0 0 10px rgba(109, 93, 252, 0); } }
        @keyframes fxShake { 0%, 100% { translate: 0 0; } 25% { translate: -6px 0; } 50% { translate: 6px 0; } 75% { translate: -3px 0; } }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; animation-delay: 0s !important; } }
    </style>
</head>

<body>

    <div class="reset-card">

        <div class="brand">
            <div class="brand-icon">✦</div>
            <h1>CollabNotes</h1>
        </div>

        <div class="header">
            <h2>Reset your password</h2>
            <p>
                Enter your new password below.
            </p>
        </div>

        <form id="resetPasswordForm">

            <div class="input-group">
                <label for="newPassword">
                    New password
                </label>

                <input
                    type="password"
                    id="newPassword"
                    placeholder="Enter new password"
                    minlength="6"
                    required
                >
            </div>

            <div class="input-group">
                <label for="confirmPassword">
                    Confirm password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm new password"
                    minlength="6"
                    required
                >
            </div>

            <div id="message" class="message"></div>

            <button type="submit">
                Reset Password
            </button>

        </form>

        <a href="/" class="back-login">
            ← Back to Login
        </a>

    </div>

    <script>

        const form = document.getElementById("resetPasswordForm");

        const newPassword =
            document.getElementById("newPassword");

        const confirmPassword =
            document.getElementById("confirmPassword");

        const message =
            document.getElementById("message");


        form.addEventListener("submit", async (event) => {

            event.preventDefault();

            const password = newPassword.value;
            const confirm = confirmPassword.value;

            if (password !== confirm) {

                message.className = "message error";
                message.textContent = "Passwords do not match.";

                return;
            }

            message.className = "message";
            message.textContent = "Resetting password...";
            message.style.display = "block";

            const params = new URLSearchParams(
                window.location.search
            );

            const token = params.get("token");

            if (!token) {

                message.className = "message error";
                message.textContent = "Invalid or missing reset token.";

                return;
            }

            try {

                const response = await fetch(
                    "/api/reset-password",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            token,
                            newPassword: password
                        })
                    }
                );

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message);
                }

                message.className = "message success";
                message.textContent =
                    "Password reset successfully! Redirecting to login...";

                setTimeout(() => {

                    window.location.href = "/";

                }, 2000);

            } catch (error) {

                message.className = "message error";
                message.textContent = error.message;

            }

        });

    </script>

</body>

</html>
